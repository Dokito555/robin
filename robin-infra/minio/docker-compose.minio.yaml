services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9102:9102"  # API port
      - "9101:9101"  # Console port
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --address ":9102" --console-address ":9101"
    volumes:
      # TODO: switch location later
      - /Users/azzura/Documents/minio:/data

volumes:
  minio_data:
